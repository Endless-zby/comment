version: '3.8'

services:
  comment-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrip-review-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/data/reviews.db
    volumes:
      - ./prisma/data:/app/prisma/data
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/hotels"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
